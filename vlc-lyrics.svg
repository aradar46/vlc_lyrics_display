<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient (VLC Orange) -->
    <linearGradient id="vlcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e14"/>
      <stop offset="55%" stop-color="#f55500"/>
      <stop offset="100%" stop-color="#cc3e00"/>
    </linearGradient>

    <!-- Translucent Overlay Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c202a"/>
      <stop offset="100%" stop-color="#101217"/>
    </linearGradient>

    <!-- Drop Shadow for base plate -->
    <filter id="plateShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    
    <!-- Shadow for floating lyrics card -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Plate (GNOME Squircle) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#vlcGrad)" filter="url(#plateShadow)"/>
  
  <!-- Top Rim Highlight -->
  <path d="M 36 8 L 92 8 C 107 8 120 21 120 36 L 120 40 C 120 25 107 12 92 12 L 36 12 C 21 12 8 25 8 40 L 8 36 C 8 21 21 8 36 8 Z" fill="#ffffff" fill-opacity="0.2"/>

  <!-- VLC Cone Silhouette Watermark -->
  <g opacity="0.16" fill="#ffffff">
    <ellipse cx="64" cy="100" rx="36" ry="6"/>
    <path d="M 58 22 L 70 22 L 94 95 L 34 95 Z"/>
  </g>

  <!-- Floating Dark Lyrics Overlay Card -->
  <g filter="url(#cardShadow)">
    <rect x="16" y="24" width="96" height="80" rx="18" fill="url(#cardGrad)"/>
    <rect x="16.5" y="24.5" width="95" height="79" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

    <!-- Header Row: Track Dot + Header Bar + Close Button -->
    <circle cx="28" cy="36" r="2.5" fill="#ff7e14"/>
    <rect x="35" y="34.5" width="38" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.35"/>
    
    <!-- Tiny Close Icon in Card Header -->
    <circle cx="98" cy="36" r="4.5" fill="#ffffff" fill-opacity="0.1"/>
    <path d="M 96 34 L 100 38 M 100 34 L 96 38" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Previous Line (dim) -->
    <rect x="28" y="47" width="52" height="4.5" rx="2.25" fill="#ffffff" fill-opacity="0.28"/>

    <!-- Active Line: Highlighted Pill -->
    <rect x="23" y="58" width="82" height="20" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ff7e14" stroke-opacity="0.45" stroke-width="1"/>
    
    <!-- Music Note Icon (Beamed Eighth Notes) -->
    <circle cx="34" cy="71" r="2" fill="#ff8c2b"/>
    <circle cx="41" cy="69" r="1.8" fill="#ff8c2b"/>
    <path d="M 35.5 65 L 35.5 71" stroke="#ff8c2b" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 42.5 63 L 42.5 69" stroke="#ff8c2b" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 35.5 65 L 42.5 63" stroke="#ff8c2b" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Active Lyric Bar -->
    <rect x="49" y="65" width="44" height="6" rx="3" fill="#ffffff"/>
    <circle cx="98" cy="68" r="2" fill="#ff8c2b"/>

    <!-- Next Line (dim) -->
    <rect x="28" y="86" width="60" height="4.5" rx="2.25" fill="#ffffff" fill-opacity="0.28"/>
  </g>
</svg>
